name: Copilot eval (smoke)

on:
  pull_request:
    # Everything the agent's answers depend on. The filter used to skip app.py,
    # most of src/ (including src/llm_config.py, the model pins) and
    # requirements.txt, so changes that could break the agent never ran it.
    paths:
      - 'app.py'
      - 'backend/**'
      - 'eval/**'
      - 'src/**'
      - 'requirements*.txt'
      - 'data/processed/**'
      - '.github/workflows/eval-on-pr.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke-eval:
    # Fork PRs get no secrets, so every row would error and the gate below
    # would fail for a reason unrelated to the change. They are gated instead
    # by tests/test_graph_smoke.py in ci.yml, which needs no key.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install OS deps for XGBoost (libomp)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # The old strip-and-reinstall dance for torch is gone: torch is no
          # longer a dependency at all (embeddings run on onnxruntime), so
          # requirements.txt installs cleanly on every platform as-is.
          pip install --prefer-binary -r requirements.txt -r requirements-agent.txt

      # Exits 2 when any row errors or degrades, which fails this job
      # (eval/run_eval.py). The 5 rows are a stratified pick, not the first 5.
      - name: Run 5-query smoke eval (no judge — cost-free)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          LANGSMITH_TRACING: 'false'
        run: |
          python -m eval.run_eval --limit 5 --no-judge --output-tag pr-smoke

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/

      - name: Comment summary on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reports = fs.readdirSync('eval/reports').filter(f => f.includes('pr-smoke') && f.endsWith('.md'));
            if (reports.length === 0) {
              core.warning('No smoke-eval report generated');
              return;
            }
            const body = '## Copilot smoke eval (5 queries, no judge)\n\n' +
              fs.readFileSync(path.join('eval/reports', reports[reports.length - 1]), 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.slice(0, 60000),
            });
