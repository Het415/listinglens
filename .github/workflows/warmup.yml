name: Keep backend warm

# ⚠️ THIS WORKFLOW IS A BACKSTOP, NOT THE WARMUP MECHANISM. ⚠️
#
# Free-tier hosts (Railway / Render free) spin the API down after ~15 min idle,
# and the first request after spin-up pays 30-80s for Python + FAISS + LangGraph
# to come back. This cron hits POST /warmup with the demo ASIN so the FAISS
# index and compiled agent graph stay hot for recruiters dropping in
# unannounced.
#
# It does not run often enough to achieve that on its own. The schedule below
# asks for every 10 minutes; GitHub throttles scheduled workflows on free
# accounts and *actually* runs it roughly every 4 hours. Measured gaps between
# real runs, 2026-09-14 → 2026-09-16, in minutes:
#
#   212, 241, 322, 294, 137, 163, 187, 293, 326, 299, 141   (median 241)
#
# Against a 15-minute spin-down that means the instance is asleep almost
# always. Do not read the cron expression as a guarantee — that mistake is
# what made the demo slow for months. The real pingers are an external cron
# and a local launchd agent; see docs/WARMUP.md. This file stays because an
# occasional extra ping is harmless and it still works as a manual
# workflow_dispatch smoke test of /warmup.
#
# Override the target by setting a repo variable `BACKEND_URL` under
# Settings → Secrets and variables → Actions → Variables. No secret needed —
# /warmup is intentionally unauthenticated and side-effect-free.

on:
  schedule:
    # Requested every 10 minutes; expect ~every 4 hours. See the note above.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Don't fail the workflow run on a single bad ping — a transient 5xx during
    # a cold boot is expected and self-healing; we just want the next cron tick
    # to retry. GitHub still records the step status.
    continue-on-error: true

    steps:
      - name: POST /warmup with demo ASIN
        env:
          # Falls back to the currently-live Railway URL when the repo var is
          # unset. Update the var (not this file) if the backend moves.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://listinglens-api.onrender.com' }}
          # DEMO_ASIN matches frontend/lib/demo-config.ts:14 — the TOZO T10
          # earbuds product the dashboard loads by default.
          DEMO_ASIN: B08XPWDSWW
        run: |
          set -u
          echo "Pinging $BACKEND_URL/warmup with asin=$DEMO_ASIN"
          # --max-time 90 survives a 60-70s cold boot + the fire-and-forget
          # response. --retry 2 + --retry-delay 15 handles transient 502s
          # mid-deploy without spamming.
          HTTP_CODE=$(curl -sS \
            --max-time 90 \
            --retry 2 \
            --retry-delay 15 \
            --retry-connrefused \
            -o /tmp/warmup-body.json \
            -w "%{http_code}" \
            -X POST \
            -H 'content-type: application/json' \
            -d "{\"asin\":\"$DEMO_ASIN\"}" \
            "$BACKEND_URL/warmup") || HTTP_CODE="000"

          echo "HTTP $HTTP_CODE"
          echo "--- response body ---"
          cat /tmp/warmup-body.json || true
          echo

          # 2xx → success. Anything else logs but doesn't fail the run
          # (continue-on-error covers the step; this just gives a clear signal
          # in the run summary).
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ warmup ok"
            exit 0
          fi
          echo "✗ warmup non-2xx; will retry next cron tick"
          exit 1
