services:
  - type: web
    name: listinglens-api
    env: python
    # Single install step. The agent layer (langgraph, mcp, instructor) is
    # folded into requirements.txt so the same install that builds the base
    # service also brings in what /agent/query and /assistant/query
    # (copilot mode) need. The previous two-step pattern was letting the
    # second install fail silently, so the agent module was missing in
    # production while the service still came up healthy.
    buildCommand: |
      pip install --upgrade pip &&
      pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      # LangSmith tracing — leave empty/unset in Render dashboard to disable
      # in production; eval/run_eval flips override=True locally so the
      # parent shell never blocks the user's own key.
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: "listinglens-copilot"
      # ── Model pins ──────────────────────────────────────────────────────
      # Groq rate-limits PER MODEL (8000 TPM each), so these four vars are a
      # load-balancing decision as much as a quality one. Defaults live in
      # src/llm_config.py; these pins exist so production never silently
      # rides a code default. Run `python -m scripts.doctor` after any change
      # — and note Groq has decommissioned models under this app three times,
      # most recently the entire Llama family.
      #
      # Planner + synthesizer + brief. Flagship: quality-sensitive.
      - key: AGENT_MODEL
        value: "openai/gpt-oss-120b"
      # Executor's tool-selection loop — several short calls per question, so
      # it gets its own bucket to keep the planner/synthesizer budget free.
      - key: EXECUTOR_MODEL
        value: "openai/gpt-oss-20b"
      # review_qa RAG + /chat. MUST be a third bucket: the executor calls
      # review_qa mid-run, so sharing would make one agent run rate-limit
      # itself — the cause of the 429s in eval/reports/2026-07-18-full.md.
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      # Intent-classification LLM fallback. Shares the executor bucket on
      # purpose: it only fires below the sklearn confidence threshold and is
      # never in the copilot request path.
      - key: INTENT_LLM_MODEL
        value: "openai/gpt-oss-20b"
      # Free-tier instance can't afford the post-boot preload sweep; keep
      # the lifespan minimal and let the frontend /warmup ping load the
      # demo ASIN on demand. Flip to "1" if you move to a paid plan with
      # headroom for eager loading.
      - key: PRELOAD_CACHE
        value: "0"
      # Render runs this service on the NATIVE python runtime (`env: python`
      # above), not the Dockerfile — so the `PYTHONUNBUFFERED=1` set in the
      # Dockerfile's ENV block never applied here, and it has to be repeated.
      #
      # Without it, Python batches stdout and the service's own diagnostics
      # arrive tens of seconds late or not at all. That is not cosmetic: the
      # `[llm_config] ... falling back to` and `[synthesizer] ... degrading`
      # lines are how a model failover is reconstructed after the fact, and
      # twice on 2026-09-17 they were missing from the exact log window being
      # investigated while the HTTP access lines around them were present.
      # A diagnostic that does not arrive is worse than none, because its
      # absence reads as "that code path did not run".
      - key: PYTHONUNBUFFERED
        value: "1"
      # ── Abuse limits (backend/http_limits.py) ───────────────────────────
      # NOTE: the live service is not linked to this file (HANDOFF.md), so
      # these must also be set on the service itself.
      #
      # The client IP is read from X-Forwarded-For, counted this many entries
      # from the RIGHT (the ones our proxy wrote). The code already defaults
      # to 1 when RENDER is set; pinned here so it is explicit. Do NOT use
      # uvicorn's --forwarded-allow-ips='*' instead: it takes the LEFTMOST
      # entry, which the client controls, so rotating a fake header would buy
      # a fresh rate limit on every request.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Requests per minute per client IP on the LLM routes.
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      # Estimated LLM calls per client IP, refilling over 24h. A Copilot run
      # counts as 8, so 48 is 6 runs up front.
      - key: LLM_CALLS_PER_IP_PER_DAY
        value: "48"
      # Estimated LLM calls per UTC day for the whole service. Groq's free tier
      # is ~30 Copilot runs per model per day, and the eval shares the key.
      - key: LLM_DAILY_BUDGET
        value: "300"
